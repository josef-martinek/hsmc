# @package _global_
defaults:
  - override /problem: null
  - override /likelihood: null
  - override /mcmc: null
  - override /sampler: null
  - _self_



problem:
  data_noise_var: 3.2
  prior_marg_var: 16.0
  n_particles: 100
  Nmin: 32
  fine_over_coarse_nsamp: 32
  ground_truth_seed: 5

experiment:
  runner:
    _target_: experiments.two_stage_mcmc.Test2StageMCMCExperiment
  sweep:
    n_runs: 200
    budgets: [5.0, 10.0, 20.0, 40.0, 80.0]
    percent_step: 2
    param_dims: [8, 16, 32, 64, 128, 256]
