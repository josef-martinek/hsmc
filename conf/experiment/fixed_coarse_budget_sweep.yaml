# @package _global_

problem:
  m: 10
  data_noise_var: 0.1
  truncation_radius_R: 8.0
  base_variance: 0.1
  param_dim: 10
  ground_truth_seed: 42
  prior_mu: 0.0
  prior_sigma: 1.0
  fine_over_coarse_nsamp: 2

experiment:
  Nmax: 2
  len_c: 50
  nsamp_min: 0.125
  scheduler_params:
    shape_p: 1.0
  runner:
    _target_: experiments.fixed_coarse_budget_sweep.FixedCoarseBudgetSweepExperiment
  ref_sol:
    N: 10000
  tempering_sampler:
    len_chain: 100
    ESSrmin: 0.9
    N: 10000

  sweep:
    n_runs: 40
    budget_seq:
      - 10.0
      - 20.0
      - 40.0
      - 80.0
      - 160.0
    n_particles_seq:
      - 50
      - 100
      - 200
    gamma_nsamp_seq:
      - 2.0
