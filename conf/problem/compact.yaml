name: "compact"
path: "problem_setup.compact_problem"
model_exact_class: "CompactModel"
param_dim: 5
data_noise_var: 0.1
prior_marg_var: 1.0

# Lightweight configuration defaults for fast execution
n_particles: 20
len_chain: 5
ESS_rmin: 0.7
ar_tol: 0.35
Nmin: 32
fine_over_coarse_nsamp: 32

likelihood_suffix: "HD"

# Ground truth parameter vector in R^d (length d=5)
ground_truth_par: [0.5, -0.5, 0.2, 0.8, -0.1]

# Bounded prior configuration to enforce the compact parameter space [-2.0, 2.0]^d
prior_type: "uniform"
prior_a: -2.0
prior_b: 2.0
